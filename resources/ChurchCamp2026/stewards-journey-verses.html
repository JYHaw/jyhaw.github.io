  if(p.superscript) html+='<div class="superscript">'+p.superscript+'</div>';
  p.verses.forEach(v=>{const t=v[1].replace(/\u3014(.+?)\u3015/g,'<span class="note">（$1）</span>');
    html+='<div class="verse"><span class="vn">'+v[0]+'</span><span class="vt">'+t+'</span></div>';});
  html+='<a class="totop" href="#jump">&uarr; 回到顶部</a>';
  sec.innerHTML=html;wrap.appendChild(sec);
});
let fs=1.08;const root=document.documentElement;
document.getElementById("inc").onclick=()=>{fs=Math.min(fs+0.08,1.55);root.style.setProperty("--fs",fs+"rem")};
document.getElementById("dec").onclick=()=>{fs=Math.max(fs-0.08,0.9);root.style.setProperty("--fs",fs+"rem")};
function revealAll(){document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));}
if("IntersectionObserver" in window){try{const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.08});document.querySelectorAll(".reveal").forEach(el=>io.observe(el));setTimeout(revealAll,1500);}catch(e){revealAll();}}else{revealAll();}
</script>
