const jump=document.getElementById("jump");
data.forEach(p=>{const a=document.createElement("a");a.href="#"+p.id;a.textContent=p.refShort;jump.appendChild(a);});
const sizer=document.createElement("div");sizer.className="sizer";
sizer.innerHTML='<button id="dec" title="缩小字体">A&minus;</button><button id="inc" title="放大字体">A+</button>';
jump.appendChild(sizer);

const map=document.getElementById("map");
data.forEach(p=>{const a=document.createElement("a");a.href="#"+p.id;a.className="station reveal";
  a.innerHTML='<span class="seal-num '+(p.topic?'topic':'')+'">'+p.station+'</span><span class="body"><span class="theme">'+p.theme+'</span><span class="meta"><span class="ref-pill">'+p.ref+'</span></span></span><span class="go">&rsaquo;</span>';
  map.appendChild(a);});

const wrap=document.getElementById("passages");
data.forEach(p=>{
  const sec=document.createElement("article");sec.className="passage reveal";sec.id=p.id;
  let html='<header><div class="num">'+(p.topic?'专题信息':'第 '+p.station+' 站')+'</div><h3>'+p.theme+'</h3><div class="ref">'+p.ref+'</div></header>';
  if(p.overview){html+='<div class="overview"><strong>信息概要</strong>'+p.overview+'</div>';}
  const hasTabs=!!(p.outline||(p.questions&&p.questions.length));
  function scrip(){
    let s='';
    if(p.superscript) s+='<div class="superscript">'+p.superscript+'</div>';
    p.verses.forEach(v=>{const t=v[1].replace(/\u3014(.+?)\u3015/g,'<span class="note">（$1）</span>');
      s+='<div class="verse"><span class="vn">'+v[0]+'</span><span class="vt">'+t+'</span></div>';});
    return s;
  }
  if(hasTabs){
    const u=p.id;
    html+='<div class="tabs"><button class="tab-btn active" data-k="sc" onclick="showTab(\''+u+'\',\'sc\')">经文</button>';
    if(p.outline) html+='<button class="tab-btn" data-k="ol" onclick="showTab(\''+u+'\',\'ol\')">讲道大纲</button>';
    if(p.questions&&p.questions.length) html+='<button class="tab-btn" data-k="qs" onclick="showTab(\''+u+'\',\'qs\')">'+(p.qLabel||'分享问题')+'</button>';
    html+='</div>';
    html+='<div class="tab-panel active" id="'+u+'-sc">'+scrip()+'</div>';
    if(p.outline) html+='<div class="tab-panel" id="'+u+'-ol"><div class="section-label">讲道大纲</div><div class="outline">'+p.outline+'</div></div>';
    if(p.questions&&p.questions.length){
      html+='<div class="tab-panel" id="'+u+'-qs"><div class="section-label">'+(p.qLabel||'分享问题')+'</div><ol class="q-list">';
      p.questions.forEach(q=>{html+='<li>'+q+'</li>';});
      html+='</ol></div>';
    }
  } else { html+=scrip(); }
  html+='<a class="totop" href="#map">&uarr; 回到旅程地图</a>';
  sec.innerHTML=html;wrap.appendChild(sec);
});

function showTab(u,which){
  ['sc','ol','qs'].forEach(k=>{const el=document.getElementById(u+'-'+k);if(el) el.classList.toggle('active',k===which);});
  document.getElementById(u).querySelectorAll('.tab-btn').forEach(btn=>{btn.classList.toggle('active',btn.dataset.k===which);});
}

let fs=1.06;const root=document.documentElement;
document.getElementById("inc").onclick=()=>{fs=Math.min(fs+0.08,1.5);root.style.setProperty("--fs",fs+"rem")};
document.getElementById("dec").onclick=()=>{fs=Math.max(fs-0.08,0.9);root.style.setProperty("--fs",fs+"rem")};

function revealAll(){document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));}
if("IntersectionObserver" in window){
  try{
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.08});
    document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
    setTimeout(revealAll,1500); // safety net so nothing stays hidden
  }catch(e){revealAll();}
}else{revealAll();}
</script>
