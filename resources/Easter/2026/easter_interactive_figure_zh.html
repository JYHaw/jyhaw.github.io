<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复活节互动图</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --card: rgba(255,255,255,0.96);
      --ink: #2f241d;
      --accent: #7a5c46;
      --border: rgba(47,36,29,0.16);
      --shadow: 0 12px 30px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 28px 18px 40px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    h1 {
      font-size: clamp(1.6rem, 2vw, 2.2rem);
      margin: 0 0 8px;
      text-align: center;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      margin: 0 0 24px;
      color: #5c5048;
      font-size: 1rem;
      line-height: 1.5;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 720px) minmax(280px, 360px);
      gap: 24px;
      align-items: start;
      justify-content: center;
    }
    .figure-card, .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .figure-card { padding: 18px; }
    .figure-box {
      position: relative;
      width: 100%;
      aspect-ratio: 768 / 1024;
      border-radius: 16px;
      overflow: hidden;
      background: #e9e9e9;
    }
    .figure-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      border: none;
      cursor: pointer;
      outline: none;
      padding: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(122, 92, 70, 0.72);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .dot:hover,
    .dot:focus-visible,
    .dot.active {
      background: rgba(122, 92, 70, 1);
      box-shadow: 0 0 0 6px rgba(122, 92, 70, 0.18);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .dot::before,
    .dot::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      inset: 0;
    }

    .dot::before {
      border: 1px solid rgba(122, 92, 70, 0.35);
      animation: pulse 2.1s infinite;
    }

    .dot::after {
      inset: -6px;
      border: 1px solid rgba(122, 92, 70, 0.20);
      animation: pulseOuter 2.1s infinite;
    }

    .dot:hover::before,
    .dot:hover::after,
    .dot:focus-visible::before,
    .dot:focus-visible::after,
    .dot.active::before,
    .dot.active::after {
      animation-duration: 1.35s;
    }

    @keyframes pulse {
      0% { opacity: 0.70; transform: scale(1); }
      70% { opacity: 0; transform: scale(2.1); }
      100% { opacity: 0; transform: scale(2.1); }
    }

    @keyframes pulseOuter {
      0% { opacity: 0.42; transform: scale(1); }
      70% { opacity: 0; transform: scale(2.8); }
      100% { opacity: 0; transform: scale(2.8); }
    }

    .tooltip {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.74rem;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(47,36,29,0.08);
      color: #6a5242;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 3;
    }

    .dot:hover .tooltip,
    .dot:focus-visible .tooltip,
    .dot.active .tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .panel {
      padding: 20px;
      position: sticky;
      top: 16px;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }
    .helper {
      margin: 0 0 18px;
      color: #645851;
      font-size: 0.96rem;
      line-height: 1.5;
    }
    .verse-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: #fffdfb;
    }
    .verse-card h3 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }
    .verse-ref {
      display: inline-block;
      margin: 0 0 12px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .verse-ref:hover { text-decoration: underline; }
    blockquote {
      margin: 0;
      padding: 0;
      font-size: 1rem;
      line-height: 1.7;
      color: #2f241d;
    }
    .note {
      margin-top: 14px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #665b53;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .buttons button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .buttons button:hover,
    .buttons button:focus-visible {
      border-color: rgba(122, 92, 70, 0.9);
      background: #fffaf6;
      outline: none;
    }
    .footer {
      margin-top: 22px;
      color: #6e625b;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .panel { position: static; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>复活节互动图</h1>
    <p class="subtitle"></p>

    <div class="layout">
      <div class="figure-card">
        <div class="figure-box" aria-label="耶稣生平互动图">
          <img src="easter_figure_zh.png" alt="素描展示婴孩耶稣、少年耶稣、成年耶稣、十字架与空坟墓。" />

          <button class="hotspot dot" style="left: 18%; top: 60%;" data-key="birth" aria-label="婴孩耶稣">
            <span class="tooltip">降生</span>
          </button>

          <button class="hotspot dot" style="left: 38%; top: 40%;" data-key="teen" aria-label="少年耶稣">
            <span class="tooltip">少年</span>
          </button>

          <button class="hotspot dot" style="left: 56%; top: 30%;" data-key="adult" aria-label="成年耶稣">
            <span class="tooltip">成年</span>
          </button>

          <button class="hotspot dot" style="left: 80%; top: 20%;" data-key="cross" aria-label="十字架">
            <span class="tooltip">十字架</span>
          </button>

          <button class="hotspot dot" style="left: 22%; top: 25%;" data-key="tomb" aria-label="复活">
            <span class="tooltip">复活</span>
          </button>

          <button class="hotspot dot" style="left: 72%; top: 13%;" data-key="title" aria-label="主题经文">
            <span class="tooltip">主题经文</span>
          </button>
        </div>
      </div>

      <aside class="panel">
        <h2 id="panel-title">马太福音 1:21</h2>
        <p class="helper">将鼠标移到图片上，或点击标记，这里的经文与可点击参考资料会随之更新。</p>

        <div class="verse-card">
          <h3 id="scene-name">主题经文</h3>
          <a id="verse-link" class="verse-ref" href="#" target="_blank" rel="noopener noreferrer">打开经文参考</a>
          <blockquote id="verse-text">“因他要将自己的百姓从罪恶里救出来。”</blockquote>
          <p id="verse-note" class="note">这是福音书开头所给出的应许，也成为整幅作品的主轴。</p>
        </div>

        <div class="buttons" aria-label="快速跳转按钮">
          <button type="button" data-jump="birth">降生</button>
          <button type="button" data-jump="teen">少年</button>
          <button type="button" data-jump="adult">成年</button>
          <button type="button" data-jump="cross">十字架</button>
          <button type="button" data-jump="tomb">复活</button>
        </div>

        <p class="footer"></p>
      </aside>
    </div>
  </div>

  <script>
    const data = {
      title: {
        label: '主题经文',
        ref: '马太福音 1:21',
        text: '“因他要将自己的百姓从罪恶里救出来。”',
        note: '这是福音书开头所给出的应许，也成为整幅作品的主轴。',
        href: 'https://www.biblegateway.com/passage/?search=Matthew%201%3A21&version=ESV'
      },
      birth: {
        label: '耶稣降生',
        ref: '路加福音 2:7',
        text: '“就生了头胎的儿子，用布包起来，放在马槽里。”',
        note: '马槽场景代表道成肉身：圣子以谦卑进入人类历史。',
        href: 'https://www.biblegateway.com/passage/?search=Luke%202%3A7&version=ESV'
      },
      teen: {
        label: '少年耶稣',
        ref: '路加福音 2:52',
        text: '“耶稣的智慧和身量，并神和人喜爱他的心，都一齐增长。”',
        note: '这对应你画中的少年阶段，也指向耶稣在智慧与生命中的成长。',
        href: 'https://www.biblegateway.com/passage/?search=Luke%202%3A52&version=ESV'
      },
      adult: {
        label: '成年耶稣',
        ref: '约翰福音 14:6',
        text: '“我就是道路、真理、生命；若不借着我，没有人能到父那里去。”',
        note: '中央的成年耶稣成为构图的核心，也可代表祂在世上的事工与身份。',
        href: 'https://www.biblegateway.com/passage/?search=John%2014%3A6&version=ESV'
      },
      cross: {
        label: '十字架',
        ref: '彼得前书 2:24',
        text: '“他被挂在木头上，亲身担当了我们的罪，使我们既然在罪上死，就得以在义上活。”',
        note: '这一部分直接连到受难日，也指向罪的刑罚在十字架上被承担。',
        href: 'https://www.biblegateway.com/passage/?search=1%20Peter%202%3A24&version=ESV'
      },
      tomb: {
        label: '空坟墓',
        ref: '路加福音 24:6',
        text: '“他不在这里，已经复活了。”',
        note: '复活的光成为整幅作品在视觉上的归向。',
        href: 'https://www.biblegateway.com/passage/?search=Luke%2024%3A6&version=ESV'
      }
    };

    const titleEl = document.getElementById('panel-title');
    const sceneNameEl = document.getElementById('scene-name');
    const verseLinkEl = document.getElementById('verse-link');
    const verseTextEl = document.getElementById('verse-text');
    const verseNoteEl = document.getElementById('verse-note');
    const hotspots = [...document.querySelectorAll('.hotspot')];
    const jumps = [...document.querySelectorAll('[data-jump]')];

    function setActive(key) {
      const item = data[key];
      if (!item) return;

      titleEl.textContent = item.ref;
      sceneNameEl.textContent = item.label;
      verseLinkEl.textContent = `打开 ${item.ref}`;
      verseLinkEl.href = item.href;
      verseTextEl.textContent = item.text;
      verseNoteEl.textContent = item.note;

      hotspots.forEach(h => h.classList.toggle('active', h.dataset.key === key));
    }

    hotspots.forEach(hotspot => {
      hotspot.addEventListener('mouseenter', () => setActive(hotspot.dataset.key));
      hotspot.addEventListener('focus', () => setActive(hotspot.dataset.key));
      hotspot.addEventListener('click', () => setActive(hotspot.dataset.key));
    });

    jumps.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.jump;
        setActive(key);
        const target = document.querySelector(`.hotspot[data-key="${key}"]`);
        if (target) target.focus();
      });
    });

    setActive('title');
  </script>
</body>
</html>
